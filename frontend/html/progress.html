<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогрес</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 22px; margin-bottom: 24px;">Прогрес</h1>

        <div class="two-col-grid">
            <div class="card">
                <h2 style="font-size: 16px; margin-bottom: 12px;">Добавете днешно тегло</h2>
                <p class="error-message" id="weight-error"></p>
                <input type="number" step="0.1" id="weight-input" placeholder="Тегло (кг)">
                <button id="add-weight-btn">Запиши</button>
            </div>

            <div class="card">
                <p class="stat-label">Седмичен прогрес</p>
                <p id="trend-value" class="numeric stat-value">—</p>
                <p class="stat-sub">кг / седмица</p>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 16px; margin-bottom: 12px;">Тегло във времето</h2>
            <canvas id="weight-chart"></canvas>
        </div>

        <div id="logs-list"></div>
    </div>

    <nav>
        <a href="dashboard.html"><i class="ti ti-user"></i><span>Профил</span></a>
        <a href="workouts.html"><i class="ti ti-barbell"></i><span>Тренировки</span></a>
        <a href="nutrition.html"><i class="ti ti-salad"></i><span>Хранене</span></a>
        <a href="progress.html" class="active"><i class="ti ti-chart-line"></i><span>Прогрес</span></a>
        <a href="ai.html"><i class="ti ti-sparkles"></i><span>AI План</span></a>
    </nav>

    <script src="js/api.js"></script>
    <script src="js/progress.js"></script>
</body>
</html>
